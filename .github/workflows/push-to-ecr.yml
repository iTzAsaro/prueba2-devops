name: Build y Push del ECR (Frontend + Backend)

on:
  push:
    branches: ["deploy"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO_FRONT: ${{ secrets.ECR_REPO_FRONT != '' && secrets.ECR_REPO_FRONT || 'front-devops-2' }}
  ECR_REPO_BACK_DESPACHOS: ${{ secrets.ECR_REPO_BACK_DESPACHOS != '' && secrets.ECR_REPO_BACK_DESPACHOS || secrets.ECR_REPO_BACK != '' && secrets.ECR_REPO_BACK || 'back-despachos-devops-2' }}
  ECR_REPO_BACK_VENTAS: ${{ secrets.ECR_REPO_BACK_VENTAS != '' && secrets.ECR_REPO_BACK_VENTAS || 'back-ventas-devops-2' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuración requerida
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          ECR_REPO_FRONT: ${{ env.ECR_REPO_FRONT }}
          ECR_REPO_BACK_DESPACHOS: ${{ env.ECR_REPO_BACK_DESPACHOS }}
          ECR_REPO_BACK_VENTAS: ${{ env.ECR_REPO_BACK_VENTAS }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          missing=0
          for k in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ECR_REPO_FRONT ECR_REPO_BACK_DESPACHOS ECR_REPO_BACK_VENTAS AWS_REGION; do
            if [ -z "$(printenv "$k")" ]; then
              echo "::error::Falta el valor requerido: $k"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        shell: bash
        env:
          ECR_REPO_FRONT: ${{ env.ECR_REPO_FRONT }}
          ECR_REPO_BACK_DESPACHOS: ${{ env.ECR_REPO_BACK_DESPACHOS }}
          ECR_REPO_BACK_VENTAS: ${{ env.ECR_REPO_BACK_VENTAS }}
        run: |
          set -euo pipefail
          for repo in "$ECR_REPO_FRONT" "$ECR_REPO_BACK_DESPACHOS" "$ECR_REPO_BACK_VENTAS"; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "$repo" >/dev/null
          done

      - name: Build and push backend (Despachos)
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_BACK_DESPACHOS }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_BACK_DESPACHOS }}:latest

      - name: Build and push backend (Ventas)
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_BACK_VENTAS }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_BACK_VENTAS }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_FRONT }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_FRONT }}:latest

  deploy-to-ec2:
    needs: build-and-push
    if: >-
      ${{
        secrets.BACKEND_INSTANCE_ID != '' &&
        secrets.FRONTEND_INSTANCE_ID != '' &&
        secrets.BACKEND_PRIVATE_IP != '' &&
        secrets.FRONT_PUBLIC_URL != '' &&
        secrets.MYSQL_DATABASE != '' &&
        secrets.MYSQL_USER != '' &&
        secrets.MYSQL_PASSWORD != '' &&
        secrets.MYSQL_ROOT_PASSWORD != '' &&
        secrets.DB_NAME != '' &&
        secrets.DB_USERNAME != '' &&
        secrets.DB_PASSWORD != ''
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend via SSM
        shell: bash
        env:
          BACKEND_INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPO_BACK_DESPACHOS: ${{ env.ECR_REPO_BACK_DESPACHOS }}
          ECR_REPO_BACK_VENTAS: ${{ env.ECR_REPO_BACK_VENTAS }}
          FRONT_PUBLIC_URL: ${{ secrets.FRONT_PUBLIC_URL }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_INSTANCE_ID}" ]; then
            echo "::error::Falta BACKEND_INSTANCE_ID en Secrets"
            exit 1
          fi
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=${BACKEND_INSTANCE_ID}" \
            --comment "Deploy backend (db + despachos + ventas) from ECR" \
            --parameters commands="[
              \"set -euo pipefail\",
              \"sudo dnf install -y docker awscli || true\",
              \"sudo systemctl enable --now docker\",
              \"sudo usermod -aG docker ec2-user || true\",
              \"sudo usermod -aG docker ssm-user || true\",
              \"AWS_REGION=${AWS_REGION}\",
              \"ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\",
              \"REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}\",
              \"docker network create app_net 2>/dev/null || true\",
              \"docker rm -f backend-despachos backend-ventas db 2>/dev/null || true\",
              \"docker run -d --name db --restart unless-stopped --network app_net -e MYSQL_DATABASE=${MYSQL_DATABASE} -e MYSQL_USER=${MYSQL_USER} -e MYSQL_PASSWORD=${MYSQL_PASSWORD} -e MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD} mysql:8.4.0\",
              \"until docker exec db mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD} --silent; do sleep 2; done\",
              \"docker pull ${REGISTRY}/${ECR_REPO_BACK_DESPACHOS}:latest\",
              \"docker pull ${REGISTRY}/${ECR_REPO_BACK_VENTAS}:latest\",
              \"docker run -d --name backend-despachos --restart unless-stopped --network app_net -p 8081:8081 -e DB_ENDPOINT=db -e DB_PORT=3306 -e DB_NAME=${DB_NAME} -e DB_USERNAME=${DB_USERNAME} -e DB_PASSWORD=${DB_PASSWORD} -e CORS_ALLOWED_ORIGINS=${FRONT_PUBLIC_URL} ${REGISTRY}/${ECR_REPO_BACK_DESPACHOS}:latest\",
              \"docker run -d --name backend-ventas --restart unless-stopped --network app_net -p 8080:8080 -e DB_ENDPOINT=db -e DB_PORT=3306 -e DB_NAME=${DB_NAME} -e DB_USERNAME=${DB_USERNAME} -e DB_PASSWORD=${DB_PASSWORD} -e CORS_ALLOWED_ORIGINS=${FRONT_PUBLIC_URL} ${REGISTRY}/${ECR_REPO_BACK_VENTAS}:latest\",
              \"docker ps\"
            ]" \
            --region "${AWS_REGION}" \
            --output text

      - name: Deploy frontend via SSM
        shell: bash
        env:
          FRONTEND_INSTANCE_ID: ${{ secrets.FRONTEND_INSTANCE_ID }}
          BACKEND_PRIVATE_IP: ${{ secrets.BACKEND_PRIVATE_IP }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPO_FRONT: ${{ env.ECR_REPO_FRONT }}
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_INSTANCE_ID}" ]; then
            echo "::error::Falta FRONTEND_INSTANCE_ID en Secrets"
            exit 1
          fi
          if [ -z "${BACKEND_PRIVATE_IP}" ]; then
            echo "::error::Falta BACKEND_PRIVATE_IP en Secrets"
            exit 1
          fi
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=${FRONTEND_INSTANCE_ID}" \
            --comment "Deploy frontend (nginx) from ECR" \
            --parameters commands="[
              \"set -euo pipefail\",
              \"sudo dnf install -y docker awscli || true\",
              \"sudo systemctl enable --now docker\",
              \"sudo usermod -aG docker ec2-user || true\",
              \"AWS_REGION=${AWS_REGION}\",
              \"ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\",
              \"REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}\",
              \"docker pull ${REGISTRY}/${ECR_REPO_FRONT}:latest\",
              \"docker rm -f frontend 2>/dev/null || true\",
              \"docker run -d --name frontend --restart unless-stopped -p 80:8080 --tmpfs /var/run:rw,noexec,nosuid,size=8m,uid=10001,gid=10001,mode=0755 --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0755 -e DESPACHOS_UPSTREAM=${BACKEND_PRIVATE_IP}:8081 -e VENTAS_UPSTREAM=${BACKEND_PRIVATE_IP}:8080 ${REGISTRY}/${ECR_REPO_FRONT}:latest\",
              \"docker ps\"
            ]" \
            --region "${AWS_REGION}" \
            --output text
