name: Build y Push del ECR (Frontend + Backend)

on:
  push:
    branches: ["deploy"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO_FRONT: ${{ secrets.ECR_REPO_FRONT != '' && secrets.ECR_REPO_FRONT || 'front-devops-2' }}
  ECR_REPO_BACK_DESPACHOS: ${{ secrets.ECR_REPO_BACK_DESPACHOS != '' && secrets.ECR_REPO_BACK_DESPACHOS || secrets.ECR_REPO_BACK != '' && secrets.ECR_REPO_BACK || 'back-despachos-devops-2' }}
  ECR_REPO_BACK_VENTAS: ${{ secrets.ECR_REPO_BACK_VENTAS != '' && secrets.ECR_REPO_BACK_VENTAS || 'back-ventas-devops-2' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuración requerida
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          ECR_REPO_FRONT: ${{ env.ECR_REPO_FRONT }}
          ECR_REPO_BACK_DESPACHOS: ${{ env.ECR_REPO_BACK_DESPACHOS }}
          ECR_REPO_BACK_VENTAS: ${{ env.ECR_REPO_BACK_VENTAS }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          missing=0
          for k in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ECR_REPO_FRONT ECR_REPO_BACK_DESPACHOS ECR_REPO_BACK_VENTAS AWS_REGION; do
            if [ -z "$(printenv "$k")" ]; then
              echo "::error::Falta el valor requerido: $k"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        shell: bash
        env:
          ECR_REPO_FRONT: ${{ env.ECR_REPO_FRONT }}
          ECR_REPO_BACK_DESPACHOS: ${{ env.ECR_REPO_BACK_DESPACHOS }}
          ECR_REPO_BACK_VENTAS: ${{ env.ECR_REPO_BACK_VENTAS }}
        run: |
          set -euo pipefail
          for repo in "$ECR_REPO_FRONT" "$ECR_REPO_BACK_DESPACHOS" "$ECR_REPO_BACK_VENTAS"; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "$repo" >/dev/null
          done

      - name: Build and push backend (Despachos)
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_BACK_DESPACHOS }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_BACK_DESPACHOS }}:latest

      - name: Build and push backend (Ventas)
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_BACK_VENTAS }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_BACK_VENTAS }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_FRONT }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_FRONT }}:latest
